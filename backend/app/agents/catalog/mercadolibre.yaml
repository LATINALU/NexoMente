  name: ML Sales Optimizer
  emoji: 📈
  description: Consultor integral de ventas en Mercado Libre — diagnóstico de cuenta, prioridades, eventos de temporada y plan de crecimiento
  short_description: Diagnóstico y plan de crecimiento ML
  specialization: Optimización de Ventas
